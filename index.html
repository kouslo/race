<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D 레이싱 게임</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="game-container">
    <div id="hud">
        <div class="hud-item">속도: <span id="speed">0</span> km/h</div>
        <div class="hud-item">기어: <span id="gear">N</span></div>
        <div class="hud-item">랩: <span id="lap">1</span> / <span id="total-laps">3</span></div>
        <div class="hud-item">시간: <span id="time">0.00</span>s</div>
        <div class="hud-item">베스트: <span id="best">--</span></div>
    </div>

    <div id="speedometer">
        <svg viewBox="0 0 200 200" width="160" height="160">
            <circle cx="100" cy="100" r="92" fill="rgba(0,0,0,0.6)" stroke="#ffd166" stroke-width="2"/>
            <g id="ticks"></g>
            <line id="needle" x1="100" y1="100" x2="100" y2="30" stroke="#ef476f" stroke-width="3" stroke-linecap="round" transform="rotate(-120 100 100)"/>
            <circle cx="100" cy="100" r="8" fill="#ffd166"/>
            <text x="100" y="160" text-anchor="middle" fill="#fff" font-size="14" font-family="Courier New">km/h</text>
        </svg>
    </div>

    <button id="mute-btn" title="BGM 토글">♪ ON</button>

    <canvas id="game"></canvas>

    <div id="overlay" class="overlay">
        <div class="panel">
            <h1>3D 레이싱</h1>
            <p>방향키 또는 WASD로 차량을 조종하세요</p>
            <ul class="controls">
                <li><b>↑ / W</b> : 가속</li>
                <li><b>↓ / S</b> : 후진 / 브레이크</li>
                <li><b>← / A</b>, <b>→ / D</b> : 좌우 회전</li>
                <li><b>Space</b> : 핸드 브레이크</li>
                <li><b>C</b> : 카메라 시점 전환</li>
                <li><b>R</b> : 재시작</li>
            </ul>
            <button id="start-btn">출발!</button>
        </div>
    </div>

    <div id="finish-overlay" class="overlay hidden">
        <div class="panel">
            <h1>완주!</h1>
            <p>총 시간: <span id="final-time">0.00</span>초</p>
            <p>베스트 랩: <span id="final-best">0.00</span>초</p>
            <button id="restart-btn">다시 시작</button>
        </div>
    </div>
</div>

<div id="error-banner" style="display:none;position:absolute;top:0;left:0;right:0;padding:12px;background:#c1121f;color:#fff;z-index:100;font-family:monospace;font-size:13px;white-space:pre-wrap;"></div>
<script>
window.addEventListener("error", (e) => {
    const el = document.getElementById("error-banner");
    el.style.display = "block";
    el.textContent = "에러: " + (e.message || e.error) + "\n" + (e.filename || "") + ":" + (e.lineno || "");
});
</script>
<script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
<script src="game.js"></script>
</body>
</html>
