<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D 레이싱 게임</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="game-container">
    <div id="hud">
        <div class="hud-item">속도: <span id="speed">0</span> km/h</div>
        <div class="hud-item">기어: <span id="gear">N</span></div>
        <div class="hud-item">거리: <span id="distance">0</span> m</div>
        <div class="hud-item" id="stage-item">STAGE <span id="stage">1</span> · <span id="stage-name">CRUISE</span></div>
        <div class="hud-item">시간: <span id="time">0.00</span>s</div>
        <div class="hud-item">베스트: <span id="best">--</span></div>
        <div class="hud-item">🪙 <span id="coins">0</span> · <span id="run-coins">0</span></div>
        <div class="hud-item hp-wrap">
            HP <span id="hp-text">100</span>
            <div class="hp-bar"><div id="hp-fill"></div></div>
        </div>
        <div class="hud-item hp-wrap" id="boost-wrap">
            NITRO <span id="boost-text">0</span>%
            <div class="hp-bar"><div id="boost-fill"></div></div>
        </div>
    </div>

    <div id="speedometer">
        <svg viewBox="0 0 200 200" width="160" height="160">
            <circle cx="100" cy="100" r="92" fill="rgba(0,0,0,0.6)" stroke="#ffd166" stroke-width="2"/>
            <g id="ticks"></g>
            <line id="needle" x1="100" y1="100" x2="100" y2="30" stroke="#ef476f" stroke-width="3" stroke-linecap="round" transform="rotate(-120 100 100)"/>
            <circle cx="100" cy="100" r="8" fill="#ffd166"/>
            <text x="100" y="160" text-anchor="middle" fill="#fff" font-size="14" font-family="Courier New">km/h</text>
        </svg>
    </div>

    <button id="mute-btn" title="BGM 토글">♪ ON</button>

    <canvas id="game"></canvas>
    <div id="postfx">
        <div id="grain"></div>
        <div id="vignette"></div>
        <div id="chroma"></div>
        <div id="speedlines"></div>
    </div>
    <div id="damage-flash"></div>
    <div id="stage-banner"></div>

    <div id="overlay" class="overlay">
        <div class="panel garage-panel">
            <h1>GARAGE</h1>
            <div class="garage-stats">
                <span>🪙 <b id="profile-coins">0</b></span>
                <span>📏 베스트 <b id="profile-best">0</b> m</span>
            </div>
            <div id="garage-grid"></div>
            <p class="hint">← / → 키 또는 차량 클릭으로 선택</p>
            <ul class="controls compact">
                <li><b>← / →</b> 차선 · <b>↑ / ↓</b> 가/감속 · <b>Shift</b> 니트로 · <b>C</b> 시점 · <b>R</b> 재시작</li>
            </ul>
            <button id="start-btn">출발!</button>
        </div>
    </div>

    <div id="finish-overlay" class="overlay hidden">
        <div class="panel">
            <h1 id="finish-title">게임 오버</h1>
            <p>주행 거리: <b style="color:#ffd166;font-size:24px;"><span id="final-distance">0</span> m</b></p>
            <p>생존 시간: <span id="final-time">0.00</span>초</p>
            <p>최고 속도: <span id="final-top">0</span> km/h</p>
            <p>획득 코인: 🪙 <span id="final-coins">0</span></p>
            <button id="restart-btn">다시 시작</button>
            <button id="garage-btn" style="margin-left:8px;background:linear-gradient(135deg,#1ec8ff,#2080ff);color:#fff;">차고로</button>
        </div>
    </div>
</div>

<div id="error-banner" style="display:none;position:absolute;top:0;left:0;right:0;padding:12px;background:#c1121f;color:#fff;z-index:100;font-family:monospace;font-size:13px;white-space:pre-wrap;"></div>
<script>
window.addEventListener("error", (e) => {
    const el = document.getElementById("error-banner");
    el.style.display = "block";
    el.textContent = "에러: " + (e.message || e.error) + "\n" + (e.filename || "") + ":" + (e.lineno || "");
});
</script>
<script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
<script src="game.js"></script>
</body>
</html>
